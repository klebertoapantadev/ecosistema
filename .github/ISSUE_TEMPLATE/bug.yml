name: Bug
description: Comportamiento incorrecto en un producto ya desplegado
title: "[BUG] "
labels: []
body:
  - type: dropdown
    id: producto
    attributes:
      label: Producto
      options:
        - Tranqi
        - FastFix Home
        - Tinkay
        - Plataforma (comun_*)
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - web
        - app-cliente
        - app-abogado
        - base-datos
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options:
        - producción
        - preview/staging
        - desarrollo local
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Comportamiento obtenido
    validations:
      required: true
  - type: checkboxes
    id: seguridad
    attributes:
      label: ¿Implica exposición de datos sensibles o falla de RLS/MFA?
      options:
        - label: Sí — marcar como bloqueante y notificar de inmediato
