name: Producto nuevo
description: Incorporar un negocio/producto nuevo al ecosistema
title: "[ONBOARDING] Nuevo producto: "
labels: []
body:
  - type: input
    id: nombre
    attributes:
      label: Nombre del producto
    validations:
      required: true
  - type: input
    id: prefijo
    attributes:
      label: Identificador corto de marca / prefijo de 3 letras propuesto
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist de incorporación
      options:
        - label: Tabla de nomenclatura completada (esquema, prefijos, entidades)
        - label: Esquema de negocio creado en Supabase
        - label: Roles registrados en seg_membresia
        - label: RLS + auditoría en todas las tablas nuevas
        - label: Columnas sensibles cifradas / enmascaradas donde corresponda
        - label: Integración con comun_facturacion si el producto cobra
        - label: App creada a partir de apps/_plantilla-web
        - label: Proyecto de Vercel + dominio + turbo-ignore configurado
        - label: especificacion-funcional.md y especificacion-tecnica.md iniciales redactadas
        - label: Producto visible en las vistas del GitHub Project
        - label: Definido si requiere workflow de entrega/escrow
