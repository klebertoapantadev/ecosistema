name: Auditoria de dependencias

# Motivo: el primer deploy de tranqi-web fue rechazado por Vercel por una
# vulnerabilidad conocida en una dependencia ya fijada. Este workflow existe
# para que eso se detecte en un PR o en el escaneo semanal, no en el deploy.
# Ver gobernanza/politicas/seguridad-dependencias.md

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1" # todos los lunes 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit (bloquea high/critical)
        run: pnpm audit --audit-level=high

      - name: Abrir issue si el escaneo programado encuentra vulnerabilidades
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fecha = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Vulnerabilidad detectada en dependencias — ${fecha}`,
              body: [
                "El escaneo semanal de `pnpm audit` encontro vulnerabilidades de severidad alta o critica.",
                "",
                `Ver el run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "SLA aplicable segun gobernanza/politicas/seguridad-dependencias.md #4. Registrar la remediacion en gobernanza/politicas/registro-incidentes-seguridad.md.",
              ].join("\n"),
            });
